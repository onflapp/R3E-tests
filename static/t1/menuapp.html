<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-BHWEMzOeAJndYu+0OCO9GgADtpfifUFP/2iwyVfDWgM='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Waldeska menu desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --mist:#E4E7E2; --card:#F7F8F5; --ink:#1D2320; --muted:#5A645D; --line:#C3C9C0;
  --hop:#2F5D3E; --hop-ink:#FFFFFF; --warn:#9A3412; --stage:#262C28;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hop);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(380px,520px) 1fr;height:100vh}
.editor{overflow-y:auto;padding:24px 24px 64px;border-right:1px solid var(--line)}
.preview{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage)}

h1{font:700 26px/1.1 Oswald,"Arial Narrow",sans-serif;letter-spacing:.01em;margin:0 0 4px}
.lead{margin:0 0 20px;color:var(--muted);max-width:44ch}
h2{font:500 18px/1.2 Oswald,"Arial Narrow",sans-serif;letter-spacing:.01em;margin:0 0 12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
label,.lbl{display:block;font-weight:500;font-size:13px;color:var(--muted);margin:0 0 4px}
input[type=text],textarea{width:100%;background:#fff;border:1px solid #AEB5AB;border-radius:4px;padding:8px 10px}
textarea{resize:vertical;min-height:84px;line-height:1.35}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;background:#fff;border:1px solid #AEB5AB;border-radius:999px;cursor:pointer}
.sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.sw[aria-pressed=true]{border-color:var(--hop);box-shadow:inset 0 0 0 1px var(--hop)}
.custom{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;background:#fff;border:1px solid #AEB5AB;border-radius:999px}
.custom input{width:28px;height:28px;padding:0;border:0;background:none;cursor:pointer}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:400;color:var(--ink);font-size:14px}

.sec{border-top:4px solid var(--hop)}
.sec-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:end;margin-bottom:12px}
.iconpick{display:flex;gap:6px}
.iconpick button{width:44px;height:44px;display:grid;place-items:center;background:#fff;border:1px solid #AEB5AB;border-radius:4px;cursor:pointer;padding:0}
.iconpick button[aria-checked=true]{border-color:var(--hop);box-shadow:inset 0 0 0 2px var(--hop)}
.iconpick img{width:26px;height:26px;object-fit:contain}
.tools{display:flex;gap:4px}
.tool{width:32px;height:32px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:0}
.tool:hover:not(:disabled){background:#fff;border-color:#8C958A}
.tool:disabled{opacity:.35;cursor:default}
.tool svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.dish{display:grid;grid-template-columns:1fr 92px 104px;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.dish:first-of-type{border-top:0;padding-top:0}
.dish .tools-h{display:flex;flex-direction:row;padding-top:21px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:4px;border:1px solid var(--hop);background:transparent;color:var(--hop);font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){background:rgba(47,93,62,.08)}
.btn.primary{background:var(--hop);color:var(--hop-ink)}
.btn.primary:hover:not(:disabled){background:#264C33}
.btn:disabled{opacity:.45;cursor:default}

.meter{margin:0 0 16px}
.meter .bar{height:8px;background:#CDD2CA;border-radius:4px;overflow:hidden}
.meter .fill{height:100%;background:var(--hop);width:0;transition:width .15s}
.meter.over .fill{background:var(--warn)}
.meter p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.meter.over p{color:var(--warn);font-weight:600}

.bar-tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid #3B443F;background:#1E2420}
.bar-tools .btn{border-color:#8FB59C;color:#CFE3D5}
.bar-tools .btn.primary{background:#D8E8DC;color:#16301F;border-color:#D8E8DC}
.bar-tools .btn.primary:hover:not(:disabled){background:#fff}
.bar-tools .btn:hover:not(:disabled){background:rgba(255,255,255,.08)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px}
.stage canvas{height:100%;max-width:100%;aspect-ratio:9/16;object-fit:contain;box-shadow:0 12px 40px rgba(0,0,0,.5);background:#000}
.status{min-height:22px;padding:6px 16px;font-size:13px;color:#B9C7BD;background:#1E2420}
.status.warn{color:#F3C9A8}

.tabs{display:none}
@media (max-width:960px){
  .app{display:block;height:auto}
  .editor{padding:16px 16px 96px;border-right:0}
  .preview{min-height:100vh;padding-bottom:52px}
  .stage{padding:12px}
  .stage canvas{height:auto;width:100%;max-width:520px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:5;background:#1E2420;border-top:1px solid #3B443F}
  .tabs button{padding:14px;background:none;border:0;color:#B9C7BD;font-weight:600;cursor:pointer}
  .tabs button[aria-selected=true]{color:#fff;box-shadow:inset 0 3px 0 #8FB59C}
  body[data-view=edit] .preview{display:none}
  body[data-view=preview] .editor{display:none}
}
@media (prefers-reduced-motion:reduce){.meter .fill{transition:none}}
</style>
</head>
<body data-view="edit">
<div class="app">
  <main class="editor" id="editor">
    <h1>Waldeska menu desk</h1>
    <p class="lead">Type the week's dishes, check the preview, download the 1080 × 1920 image for Instagram.</p>

    <div class="card">
      <h2>Menu text</h2>
      <div class="row2">
        <div><label for="f-title">Title</label><input type="text" id="f-title" maxlength="40" autocomplete="off"></div>
        <div><label for="f-sub">Subtitle</label><input type="text" id="f-sub" maxlength="40" autocomplete="off"></div>
      </div>
      <div style="margin-top:16px">
        <span class="lbl" id="acc-lbl">Accent color</span>
        <div class="swatches" role="group" aria-labelledby="acc-lbl" id="swatches"></div>
        <label class="check"><input type="checkbox" id="f-claim"> Use the accent on the logo tagline too</label>
      </div>
    </div>

    <div class="meter" id="meter" aria-live="polite">
      <div class="bar"><div class="fill" id="meter-fill"></div></div>
      <p id="meter-text"></p>
    </div>

    <div id="sections"></div>
    <button class="btn" id="add-section" type="button">Add section</button>
  </main>

  <section class="preview" aria-label="Menu preview">
    <div class="bar-tools">
      <button class="btn primary" id="b-png" type="button">Download PNG</button>
      <button class="btn" id="b-save" type="button">Save data</button>
      <button class="btn" id="b-load" type="button">Load data</button>
      <input type="file" id="f-file" accept="application/json,.json" hidden>
    </div>
    <div class="stage"><canvas id="cv" width="1080" height="1920" role="img" aria-label="Preview of the menu image"></canvas></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
</div>
<div class="tabs" role="tablist">
  <button role="tab" id="t-edit" aria-selected="true" type="button">Edit</button>
  <button role="tab" id="t-prev" aria-selected="false" type="button">Preview</button>
</div>

    });
  }
  function drawNow() { return neededImages().then(function (im) { updateMeter(paint(im)); }); }

  var meter = document.getElementById('meter'), meterFill = document.getElementById('meter-fill'), meterText = document.getElementById('meter-text');
  function updateMeter(bodyEnd) {
    var cap = BODY_LIMIT - BODY_TOP, used = bodyEnd - BODY_TOP, left = Math.round(BODY_LIMIT - bodyEnd);
    meterFill.style.width = Math.min(100, Math.max(0, used / cap * 100)) + '%';
    meter.classList.toggle('over', left < 0);
    meterText.textContent = left < 0
      ? 'Too long: the menu runs ' + (-left) + ' px into the Holka z Vršovic logo. Remove a dish or shorten a name.'
      : 'Room left: about ' + left + ' px, enough for ' + Math.floor(left / 98) + ' more one-line dish' + (Math.floor(left / 98) === 1 ? '' : 'es') + '.';
  }

  var statusEl = document.getElementById('status'), statusTimer;
  function setStatus(msg, warn) {
    statusEl.textContent = msg; statusEl.classList.toggle('warn', !!warn);
    clearTimeout(statusTimer); if (msg && !warn) statusTimer = setTimeout(function () { statusEl.textContent = ''; }, 4000);
  }

  // ---------- persistence (only where the host provides window.storage; otherwise use Save/Load data) ----------
  var saveTimer;
  function scheduleSave() {
    if (!window.storage || typeof window.storage.set !== 'function') return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { try { Promise.resolve(window.storage.set(STORE_KEY, JSON.stringify(state))).catch(function () {}); } catch (e) {} }, 500);
  }
  function changed() { scheduleDraw(); scheduleSave(); }

  // ---------- editor UI (DOM built with textContent only) ----------
  function el(tag, opts) {
    var n = document.createElement(tag); opts = opts || {};
    if (opts.cls) n.className = opts.cls;
    if (opts.text != null) n.textContent = opts.text;
    if (opts.attrs) Object.keys(opts.attrs).forEach(function (k) { n.setAttribute(k, opts.attrs[k]); });
    if (opts.on) Object.keys(opts.on).forEach(function (k) { n.addEventListener(k, opts.on[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) n.appendChild(arguments[i]);
    return n;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function glyph(d) { var s = document.createElementNS(SVGNS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); var p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); s.appendChild(p); return s; }
  var G = { up: 'M6 15l6-6 6 6', down: 'M6 9l6 6 6-6', del: 'M6 6l12 12M18 6L6 18' };
  function tool(label, g, disabled, fn) {
    var b = el('button', { cls: 'tool', attrs: { type: 'button', 'aria-label': label, title: label }, on: { click: fn } }); b.appendChild(glyph(G[g])); b.disabled = !!disabled; return b;
  }
  function move(arr, i, d) { var j = i + d; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }

  var inkIcons = {};
  function inkIcon(key) {                  // small icon previews in the editor, colored with the UI ink
    var img = document.createElement('img'); img.alt = ''; img.width = 26; img.height = 26;
    var svg = b64text(ASSETS.svg[key]).replace(GOLD_FILL, 'fill="#1D2320"');
    img.src = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' })); return img;
  }

  var focusTarget = null;
  function renderEditor() {
    var host = document.getElementById('sections'); host.textContent = '';
    state.sections.forEach(function (s, si) {
      var card = el('section', { cls: 'card sec', attrs: { 'aria-label': 'Section ' + (si + 1) } });
      var picker = el('div', { cls: 'iconpick', attrs: { role: 'radiogroup', 'aria-label': 'Section icon' } });
      Object.keys(ICONS).forEach(function (k) {
        var b = el('button', { attrs: { type: 'button', role: 'radio', 'aria-checked': String(s.icon === k), 'aria-label': ICONS[k].label, title: ICONS[k].label },
          on: { click: function () { s.icon = k; renderEditor(); changed(); } } });
        b.appendChild(inkIcon(k)); picker.appendChild(b);
      });
      var tid = 'st-' + si;
      var titleIn = el('input', { attrs: { type: 'text', id: tid, maxlength: String(LIMITS.secTitle), autocomplete: 'off' }, on: { input: function (e) { s.title = e.target.value; changed(); } } });
      titleIn.value = s.title;
      var titleBox = el('div', { }, el('label', { text: 'Section title', attrs: { for: tid } }), titleIn);
      var tools = el('div', { cls: 'tools' },
        tool('Move section up', 'up', si === 0, function () { move(state.sections, si, -1); renderEditor(); changed(); }),
        tool('Move section down', 'down', si === state.sections.length - 1, function () { move(state.sections, si, 1); renderEditor(); changed(); }),
        tool('Remove section', 'del', false, function () { if (s.items.length && !confirm('Remove "' + (s.title || 'this section') + '" and its ' + s.items.length + ' dish(es)?')) return; state.sections.splice(si, 1); renderEditor(); changed(); }));
      card.appendChild(el('div', { cls: 'sec-head' }, picker, titleBox, tools));

      s.items.forEach(function (it, ii) {
        var nid = 'n-' + si + '-' + ii, pid = 'p-' + si + '-' + ii;
        var ta = el('textarea', { attrs: { id: nid, maxlength: String(LIMITS.name), 'data-si': String(si), 'data-ii': String(ii), rows: '3' }, on: { input: function (e) { it.name = e.target.value; changed(); } } });
        ta.value = it.name;
        var pr = el('input', { attrs: { type: 'text', id: pid, maxlength: String(LIMITS.price), autocomplete: 'off', inputmode: 'text' }, on: { input: function (e) { it.price = e.target.value; changed(); } } });
        pr.value = it.price;
        var tl = el('div', { cls: 'tools tools-h' },
          tool('Move dish up', 'up', ii === 0, function () { move(s.items, ii, -1); renderEditor(); changed(); }),
          tool('Move dish down', 'down', ii === s.items.length - 1, function () { move(s.items, ii, 1); renderEditor(); changed(); }),
          tool('Remove dish', 'del', false, function () { s.items.splice(ii, 1); renderEditor(); changed(); }));
        card.appendChild(el('div', { cls: 'dish' },
          el('div', {}, el('label', { text: 'Dish description', attrs: { for: nid } }), ta),
          el('div', {}, el('label', { text: 'Price', attrs: { for: pid } }), pr),
          tl));
      });
      card.appendChild(el('button', { cls: 'btn', text: 'Add dish', attrs: { type: 'button' }, on: { click: function () {
        if (s.items.length >= LIMITS.items) return;
        s.items.push({ name: '', price: '' }); focusTarget = { si: si, ii: s.items.length - 1 }; renderEditor(); changed(); } } }));
      card.lastChild.disabled = s.items.length >= LIMITS.items;
      host.appendChild(card);
    });
    document.getElementById('add-section').disabled = state.sections.length >= LIMITS.sections;
    if (focusTarget) { var t = host.querySelector('textarea[data-si="' + focusTarget.si + '"][data-ii="' + focusTarget.ii + '"]'); if (t) t.focus(); focusTarget = null; }
  }

  function renderSwatches() {
    var box = document.getElementById('swatches'); box.textContent = '';
    var matched = false;
    SWATCHES.forEach(function (sw) {
      var on = state.accent.toUpperCase() === sw.hex; matched = matched || on;
      var dot = el('i'); dot.style.background = sw.hex;
      box.appendChild(el('button', { cls: 'sw', attrs: { type: 'button', 'aria-pressed': String(on) }, on: { click: function () { state.accent = sw.hex; renderSwatches(); changed(); } } }, dot, el('span', { text: sw.name })));
    });
    var picker = el('input', { attrs: { type: 'color', id: 'f-color', 'aria-label': 'Custom accent color' }, on: { input: function (e) { if (HEX.test(e.target.value)) { state.accent = e.target.value.toUpperCase(); changed(); } }, change: function () { renderSwatches(); } } });
    picker.value = state.accent.toLowerCase();
    box.appendChild(el('label', { cls: 'custom', attrs: { for: 'f-color' }, text: matched ? 'Custom' : 'Custom (in use)' }, picker));
    box.lastChild.style.margin = '0'; box.lastChild.style.fontWeight = '500';
    box.lastChild.insertBefore(picker, box.lastChild.firstChild);
  }

  function syncFields() {
    document.getElementById('f-title').value = state.title;
    document.getElementById('f-sub').value = state.subtitle;
    document.getElementById('f-claim').checked = state.claim;
    renderSwatches(); renderEditor();
  }

  // ---------- wiring ----------
  document.getElementById('f-title').addEventListener('input', function (e) { state.title = e.target.value; changed(); });
  document.getElementById('f-sub').addEventListener('input', function (e) { state.subtitle = e.target.value; changed(); });
  document.getElementById('f-claim').addEventListener('change', function (e) { state.claim = e.target.checked; changed(); });
  document.getElementById('add-section').addEventListener('click', function () {
    if (state.sections.length >= LIMITS.sections) return;
    state.sections.push({ title: '', icon: 'soup', items: [{ name: '', price: '' }] }); renderEditor(); changed();
    var ins = document.querySelectorAll('#sections .sec'); var last = ins[ins.length - 1]; if (last) { var f = last.querySelector('input[type=text]'); if (f) f.focus(); last.scrollIntoView({ block: 'nearest' }); }
  });

  function download(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  document.getElementById('b-png').addEventListener('click', function () {
    drawNow().then(function () { cv.toBlob(function (b) { if (!b) { setStatus('Could not create the image.', true); return; } download(b, 'waldeska-menu.png'); setStatus('Downloaded waldeska-menu.png (1080 × 1920).'); }, 'image/png'); })
      .catch(function () { setStatus('Could not create the image.', true); });
  });
  document.getElementById('b-save').addEventListener('click', function () {
    download(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), 'waldeska-menu.json'); setStatus('Saved waldeska-menu.json. Use "Load data" to continue later.');
  });
  var fileIn = document.getElementById('f-file');
  document.getElementById('b-load').addEventListener('click', function () { fileIn.click(); });
  fileIn.addEventListener('change', function () {
    var f = fileIn.files && fileIn.files[0]; fileIn.value = ''; if (!f) return;
    if (f.size > LIMITS.file) { setStatus('That file is too large to be a menu file (limit 100 KB).', true); return; }
    f.text().then(function (t) { state = sanitize(JSON.parse(t)); syncFields(); changed(); setStatus('Loaded ' + f.name + '.'); })
      .catch(function () { setStatus('That file is not a valid menu file. Choose a .json saved with "Save data".', true); });
  });

  var tE = document.getElementById('t-edit'), tP = document.getElementById('t-prev');
  function view(v) { document.body.dataset.view = v; tE.setAttribute('aria-selected', String(v === 'edit')); tP.setAttribute('aria-selected', String(v === 'preview')); if (v === 'preview') scheduleDraw(); }
  tE.addEventListener('click', function () { view('edit'); }); tP.addEventListener('click', function () { view('preview'); });

  // ---------- start ----------
  function fontsLoaded() { return Array.from(document.fonts).some(function (f) { return f.family.replace(/"/g, '') === 'Oswald' && f.status === 'loaded'; }); }
  function init() {
    syncFields(); scheduleDraw();
    var sample = 'ČŘŽÝŠěščřžýáíéúůňťď0123456789';
    Promise.all(['700 72px Oswald', '500 48px Oswald', '400 40px Oswald'].map(function (f) { return document.fonts.load(f, sample); }))
      .catch(function () {}).then(function () {
        scheduleDraw();
        if (!fontsLoaded()) setStatus('The Oswald font could not be loaded (offline?). The preview uses a fallback font; connect to the internet for the exact look.', true);
      });
    document.fonts.addEventListener('loadingdone', scheduleDraw);
    if (window.storage && typeof window.storage.get === 'function') {
      Promise.resolve(window.storage.get(STORE_KEY)).then(function (r) {
        if (r && r.value) { state = sanitize(JSON.parse(r.value)); syncFields(); scheduleDraw(); setStatus('Restored your last menu.'); }
      }).catch(function () {});
    }
  }
  init();
})();

</script>
</body>
